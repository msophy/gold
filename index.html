<style>
:root{--bg:#000;--ink:#d1d4dc;--muted:#787b86;--line:#1b1f29;--up:#26a69a;--down:#ef5350;--gold:#f0b90b;--chip:#2a2e39;--panel:#0b0e13;
  box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none;
  font-family:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1000px;margin:0 auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:6px;padding:6px 8px;direction:ltr;border-bottom:1px solid var(--line)}
.tfs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tfs::-webkit-scrollbar{display:none}
.tfs button,.ib{background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:6px;font-size:13px;white-space:nowrap}
.tfs button[aria-pressed="true"]{color:var(--gold);background:var(--chip);font-weight:600}
.ib{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:16px;line-height:1;padding:7px 10px;min-width:36px}
#bell[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;margin:0 4px}
.dot.live{background:var(--up);animation:pulse 1.8s ease-in-out infinite}
.dot.off{background:var(--down)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(38,166,154,.55)}50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
.plotwrap{flex:1;min-height:0;position:relative}
.plot{position:absolute;inset:0;touch-action:none;direction:ltr;cursor:crosshair;user-select:none;-webkit-user-select:none}
.plot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{position:absolute;top:6px;left:8px;right:70px;font-size:11.5px;line-height:1.5;pointer-events:none;direction:ltr;text-align:left;font-variant-numeric:tabular-nums;text-shadow:0 0 4px #000}
.legend .sym{color:var(--ink);font-weight:600}.legend .tm{color:var(--muted)}
.gb{color:var(--up)}.gs{color:var(--down)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted);text-align:center;padding:0 24px;direction:rtl}
.toast{position:absolute;top:44px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;background:#14181f;border:1px solid var(--muted);border-radius:10px;padding:10px 12px;font-size:.85rem;line-height:1.5;direction:rtl;text-align:right;z-index:3;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.toast.buy{border-color:var(--up)}.toast.sell{border-color:var(--down)}
.toast[hidden]{display:none}
.foot{padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--panel)}
.sentrow{display:flex;align-items:center;gap:10px;font-size:.9rem}
.sentrow .b{color:var(--up);white-space:nowrap}.sentrow .s{color:var(--down);white-space:nowrap}
.sentrow b{font-size:1.05rem}
.sent{flex:1;display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);direction:ltr}
#sentB{background:var(--up);height:100%;transition:width .6s}#sentS{background:var(--down);height:100%;transition:width .6s}
.sub{font-size:.7rem;color:var(--muted);margin-top:4px;line-height:1.5}
.banner{margin:4px 0 0;font-size:.75rem;color:var(--gold)}
details{margin-top:4px}summary{cursor:pointer;font-size:.74rem;color:var(--muted)}
.field{margin-top:8px}label.f{display:block;font-size:.74rem;color:var(--muted);margin-bottom:4px;line-height:1.6}
.row{display:flex;gap:8px}
input[type=text],input[type=url]{flex:1;min-width:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:.9rem;direction:ltr;text-align:left}
.ghost[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.8rem}
</style>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var PRICE_URL = 'https://api.gold-api.com/price/XAU';
  var POLL_MS = 1000, SENT_MS = 300000, KEY = 'gold-tv-v1';
  var TFS = [15, 30, 60, 300, 900, 3600], SIGTFS = [15, 30, 60, 300, 900];
  var TFLBL = { 15:'15ث', 30:'30ث', 60:'1د', 300:'5د', 900:'15د', 3600:'1س' };
  var TFEN = { 15:'15s', 30:'30s', 60:'1m', 300:'5m', 900:'15m', 3600:'1h' };
  var HTF_OF = { 15:60, 30:300, 60:300, 300:900, 900:3600 };
  var HIST = { 60:'1m', 300:'5m', 900:'15m', 3600:'1h' };
  var HOSTS = ['https://data-api.binance.vision', 'https://api.binance.com'];
  var fmt = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

  var S = { ver:2, tf:60, sens:'high', mode:'pips', tpPips:35, slPips:25, pipUsd:0.10, notify:false, ntfy:'', sentUrl:'', sentExt:null, sentTs:0, candles:{}, signals:[] };
  TFS.forEach(function(t){ S.candles[t] = []; });
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var P = JSON.parse(raw);
      ['tf','sens','mode','tpPips','slPips','pipUsd','notify','ntfy','sentUrl','sentExt','sentTs'].forEach(function(k){ if (P[k] !== undefined) S[k] = P[k]; });
      if (P.ver !== 2) S.sens = 'high';
      if (Array.isArray(P.signals)) S.signals = P.signals.filter(function(s){ return s && s.ts > Date.now() - 12*3600*1000; }).slice(-100);
      if (P.candles) TFS.forEach(function(t){
        if (Array.isArray(P.candles[t])) S.candles[t] = P.candles[t].map(function(a){ return { b:a[0], t:a[0]*t*1000, o:a[1], h:a[2], l:a[3], c:a[4] }; });
      });
    }
  } catch(e) {}
  if (TFS.indexOf(S.tf) < 0) S.tf = 60;
  var lastSaveAt = 0;
  function save(){
    try {
      var o = { ver:2, tf:S.tf, sens:S.sens, mode:S.mode, tpPips:S.tpPips, slPips:S.slPips, pipUsd:S.pipUsd, notify:S.notify, ntfy:S.ntfy, sentUrl:S.sentUrl, sentExt:S.sentExt, sentTs:S.sentTs, signals:S.signals, candles:{} };
      TFS.forEach(function(t){ o.candles[t] = S.candles[t].slice(-400).map(function(c){ return [c.b, c.o, c.h, c.l, c.c]; }); });
      localStorage.setItem(KEY, JSON.stringify(o));
      lastSaveAt = Date.now();
    } catch(e) {}
  }

  var oz = 0, lastOkAt = 0, failures = 0, marketTs = 0, timer = null, inFlight = false, histAt = 0, hiddenAt = 0;
  var V = { bars:70, off:0 }, view = { firstB:0, rightB:0, slot:1, cw:1 }, cur = null, pinned = false;

  function pad(x){ return (x<10?'0':'') + x; }
  function hm(ts){ var d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function hms(ts){ var d = new Date(ts); return hm(ts)+':'+pad(d.getSeconds()); }
  function ageText(sec){
    if (sec < 5) return 'الآن';
    if (sec < 60) return 'قبل ' + sec + ' ثانية';
    if (sec < 3600) return 'قبل ' + Math.floor(sec/60) + ' دقيقة';
    if (sec < 86400) return 'قبل ' + Math.floor(sec/3600) + ' ساعة';
    return 'قبل ' + Math.floor(sec/86400) + ' يوم';
  }
  function lb(a, b){ var lo = 0, hi = a.length; while (lo < hi) { var m = (lo + hi) >> 1; if (a[m].b < b) lo = m + 1; else hi = m; } return lo; }
  function r2(x){ return Math.round(x * 100) / 100; }

  /* ---------- analysis engine ---------- */
  /*ENGINE_START*/
function emaArr(v, n){
  var k = 2 / (n + 1), o = [], e = 0;
  for (var i = 0; i < v.length; i++) { e = i ? v[i] * k + e * (1 - k) : v[0]; o.push(e); }
  return o;
}
function rsiArr(v, n){
  var o = [], ag = 0, al = 0;
  for (var i = 0; i < v.length; i++) {
    if (i === 0) { o.push(null); continue; }
    var d = v[i] - v[i-1], g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    if (i <= n) {
      ag += g; al += l;
      if (i === n) { ag /= n; al /= n; o.push(al === 0 ? 100 : 100 - 100 / (1 + ag / al)); } else o.push(null);
    } else {
      ag = (ag * (n - 1) + g) / n; al = (al * (n - 1) + l) / n;
      o.push(al === 0 ? 100 : 100 - 100 / (1 + ag / al));
    }
  }
  return o;
}
function atrAvg(cs, n){
  var s = 0, k = 0;
  for (var i = cs.length - n; i < cs.length; i++) {
    if (i < 1) continue;
    s += Math.max(cs[i].h - cs[i].l, Math.abs(cs[i].h - cs[i-1].c), Math.abs(cs[i].l - cs[i-1].c)); k++;
  }
  return k ? s / k : 0;
}
function swings(cs, k){
  var hi = [], lo = [], n = cs.length;
  for (var i = k; i < n - k; i++) {
    var isH = true, isL = true;
    for (var j = 1; j <= k; j++) {
      if (!(cs[i].h > cs[i-j].h && cs[i].h > cs[i+j].h)) isH = false;
      if (!(cs[i].l < cs[i-j].l && cs[i].l < cs[i+j].l)) isL = false;
    }
    if (isH) hi.push({ i:i, p:cs[i].h });
    if (isL) lo.push({ i:i, p:cs[i].l });
  }
  return { hi:hi, lo:lo };
}
function mk(){ return { s:0, why:[], smc:0, cls:0 }; }
function add(o, pts, tag, kind){ o.s += pts; o.why.push(tag); if (kind === 'smc') o.smc++; else if (kind === 'cls') o.cls++; }

var SIG_TH = 8, OPP_MAX = 2.5, DIAG = null;
/* cs: closed candles (ascending), htf: closed higher-timeframe candles, price: entry, utcMin: minutes since 00:00 UTC */
function analyze(cs, htf, price, utcMin, opt){
  var n = cs.length;
  if (n < 45) { DIAG = { st:'data', n:n }; return null; }
  var L = cs[n-1], P = cs[n-2];
  var atr = atrAvg(cs, 14);
  if (!(atr > 0) || atr / L.c < 0.00003) { DIAG = { st:'flat' }; return null; }
  if (L.b - cs[n-20].b > 26) { DIAG = { st:'gap' }; return null; }
  var nf = 0, q;
  for (q = n - 14; q < n; q++) if (cs[q].h > cs[q].l) nf++;
  if (nf < 10) { DIAG = { st:'flat' }; return null; }
  if (opt && opt.tpUsd && opt.tpUsd > 8 * atr) { DIAG = { st:'far', tp:opt.tpUsd }; return null; }
  var hr = Math.floor(utcMin / 60);
  if (hr >= 21 && hr < 23) { DIAG = { st:'time' }; return null; }
  if (!htf || htf.length < 14) { DIAG = { st:'htf', hn:htf ? htf.length : 0 }; return null; }
  var hc = htf.map(function(c){ return c.c; }), h5 = emaArr(hc, 5), h13 = emaArr(hc, 13), hn = hc.length - 1;
  var hBull = h5[hn] > h13[hn] && hc[hn] > h13[hn], hBear = h5[hn] < h13[hn] && hc[hn] < h13[hn];
  if (!hBull && !hBear) { DIAG = { st:'range' }; return null; }

  var closes = cs.map(function(c){ return c.c; });
  var Lg = mk(), Sh = mk();

  /* classic: trend, momentum, volatility */
  var e9 = emaArr(closes, 9), e21 = emaArr(closes, 21), e50 = emaArr(closes, 50);
  if (e9[n-1] > e21[n-1] && e21[n-1] > e50[n-1] && L.c > e21[n-1]) add(Lg, 2, 'EMA');
  if (e9[n-1] < e21[n-1] && e21[n-1] < e50[n-1] && L.c < e21[n-1]) add(Sh, 2, 'EMA');
  var rs = rsiArr(closes, 14), r = rs[n-1], rp = rs[n-2];
  if (r != null && rp != null) {
    if ((r > rp && r > 35 && r < 68) || (rp < 30 && r > rp)) add(Lg, 1, 'RSI');
    if ((r < rp && r < 65 && r > 32) || (rp > 70 && r < rp)) add(Sh, 1, 'RSI');
  }
  var e12 = emaArr(closes, 12), e26 = emaArr(closes, 26);
  var ml = e12.map(function(v, i){ return v - e26[i]; }), sg = emaArr(ml, 9);
  var hist = ml[n-1] - sg[n-1], histP = ml[n-2] - sg[n-2];
  if (hist > 0 && hist > histP) add(Lg, 1, 'MACD');
  if (hist < 0 && hist < histP) add(Sh, 1, 'MACD');
  var m = 0, sd = 0, w = 20;
  for (q = n - w; q < n; q++) m += closes[q]; m /= w;
  for (q = n - w; q < n; q++) sd += (closes[q] - m) * (closes[q] - m);
  sd = Math.sqrt(sd / w);
  if (L.l <= m - 2 * sd && L.c > m - 2 * sd) add(Lg, 1, 'BB', 'cls');
  if (L.h >= m + 2 * sd && L.c < m + 2 * sd) add(Sh, 1, 'BB', 'cls');

  /* classic: candle patterns */
  var body = Math.abs(L.c - L.o), rng = L.h - L.l, upW = L.h - Math.max(L.o, L.c), loW = Math.min(L.o, L.c) - L.l, pb = Math.abs(P.c - P.o);
  if (rng >= 0.5 * atr) {
    if (P.c < P.o && L.c > L.o && L.c >= P.o && L.o <= P.c && body > pb) add(Lg, 1.5, 'engulf', 'cls');
    if (P.c > P.o && L.c < L.o && L.c <= P.o && L.o >= P.c && body > pb) add(Sh, 1.5, 'engulf', 'cls');
    var bb = Math.max(body, 0.05 * rng);
    if (loW >= 2 * bb && upW <= 0.3 * rng) add(Lg, 1.5, 'pin', 'cls');
    if (upW >= 2 * bb && loW <= 0.3 * rng) add(Sh, 1.5, 'pin', 'cls');
  }

  /* classic: support / resistance from swing pivots, SMC: sweep + structure */
  var sw = swings(cs, 2), z = 0.35 * atr, sweepLo = null, sweepHi = null, i;
  for (i = sw.lo.length - 1; i >= 0; i--) {
    var s = sw.lo[i];
    if (s.i < n - 40) break;
    if (s.i > n - 3) continue;
    if (L.l < s.p && L.c > s.p) { if (sweepLo === null) sweepLo = s.p; }
    else if (Math.abs(L.l - s.p) <= z && L.c > s.p && L.c > L.o) { if (Lg.why.indexOf('S/R') < 0) add(Lg, 1.5, 'S/R', 'cls'); }
  }
  for (i = sw.hi.length - 1; i >= 0; i--) {
    var t = sw.hi[i];
    if (t.i < n - 40) break;
    if (t.i > n - 3) continue;
    if (L.h > t.p && L.c < t.p) { if (sweepHi === null) sweepHi = t.p; }
    else if (Math.abs(L.h - t.p) <= z && L.c < t.p && L.c < L.o) { if (Sh.why.indexOf('S/R') < 0) add(Sh, 1.5, 'S/R', 'cls'); }
  }
  if (sweepLo !== null) add(Lg, 2, 'sweep', 'smc');
  if (sweepHi !== null) add(Sh, 2, 'sweep', 'smc');
  var lastHi = sw.hi.length ? sw.hi[sw.hi.length-1] : null, lastLo = sw.lo.length ? sw.lo[sw.lo.length-1] : null;
  if (lastHi && L.c > lastHi.p && P.c <= lastHi.p) {
    var bearBefore = sw.hi.length >= 2 && sw.hi[sw.hi.length-1].p < sw.hi[sw.hi.length-2].p;
    add(Lg, bearBefore ? 2 : 1.5, bearBefore ? 'CHoCH' : 'BOS', 'smc');
  }
  if (lastLo && L.c < lastLo.p && P.c >= lastLo.p) {
    var bullBefore = sw.lo.length >= 2 && sw.lo[sw.lo.length-1].p > sw.lo[sw.lo.length-2].p;
    add(Sh, bullBefore ? 2 : 1.5, bullBefore ? 'CHoCH' : 'BOS', 'smc');
  }

  /* SMC: fair value gap (first retest) */
  var k, j, a, c3, hit;
  for (k = n - 3; k >= Math.max(1, n - 13); k--) {
    a = cs[k-1]; c3 = cs[k+1];

    var bw = Math.max(1, slot * 0.7), wick = slot < 4 ? 1 : 1.2;
    vc.forEach(function(c){
      var xc = X(c.b), col = c.c >= c.o ? 'var(--up)' : 'var(--down)';
      var yTop = Y(Math.max(c.o, c.c)), yBot = Y(Math.min(c.o, c.c)), hgt = Math.max(1, yBot - yTop);
      out += '<line x1="'+xc.toFixed(1)+'" x2="'+xc.toFixed(1)+'" y1="'+Y(c.h)+'" y2="'+Y(c.l)+'" style="stroke:'+col+'" stroke-width="'+wick+'"/>';
      out += '<rect x="'+(xc - bw/2).toFixed(1)+'" y="'+yTop+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" style="fill:'+col+'"/>';
    });
    /* arrows */
    var byB = {}; vc.forEach(function(c){ byB[c.b] = c; });
    vis.forEach(function(s){
      var c = byB[s.b]; if (!c) return;
      var xc = X(s.b);
      if (s.side === 'buy') {
        var y0 = Y(c.l) + 5;
        out += '<polygon points="'+xc.toFixed(1)+','+y0+' '+(xc-5).toFixed(1)+','+(y0+9)+' '+(xc+5).toFixed(1)+','+(y0+9)+'" style="fill:var(--up)"/>';
        out += '<text x="'+xc.toFixed(1)+'" y="'+(y0+20)+'" text-anchor="middle" font-size="9.5" font-weight="600" style="fill:var(--up)">buy</text>';
      } else {
        var y1 = Y(c.h) - 5;
        out += '<polygon points="'+xc.toFixed(1)+','+y1+' '+(xc-5).toFixed(1)+','+(y1-9)+' '+(xc+5).toFixed(1)+','+(y1-9)+'" style="fill:var(--down)"/>';
        out += '<text x="'+xc.toFixed(1)+'" y="'+(y1-12)+'" text-anchor="middle" font-size="9.5" font-weight="600" style="fill:var(--down)">sell</text>';
      }
    });
    /* last price */
    var lc = a[a.length-1], lcol = lc.c >= lc.o ? 'var(--up)' : 'var(--down)', ly = Y(lc.c);
    if (lc.b <= rightB) {
      out += '<line x1="0" x2="'+CW+'" y1="'+ly+'" y2="'+ly+'" style="stroke:'+lcol+'" stroke-dasharray="2 3" opacity=".85"/>';
      out += '<rect x="'+(CW+1)+'" y="'+(ly-8)+'" width="'+(GUT-2)+'" height="16" rx="2" style="fill:'+lcol+'"/>';
      out += '<text x="'+(CW+1+(GUT-2)/2)+'" y="'+(ly+4)+'" text-anchor="middle" font-size="10.5" font-weight="600" style="fill:#fff">'+fmt.format(lc.c)+'</text>';
    }
    /* crosshair */
    var cc = null;
    if (cur !== null && cur >= firstB && cur <= rightB) {
      cc = byB[cur] || null;
      if (cc) out += '<line x1="'+X(cur).toFixed(1)+'" x2="'+X(cur).toFixed(1)+'" y1="'+top+'" y2="'+bot+'" style="stroke:var(--muted)" stroke-dasharray="3 3"/>';
    }
    svg.innerHTML = out;
    renderLegend(cc || vc[vc.length-1], !!cc);
    renderStats();
  }
  function renderLegend(c, isCur){
    var up = c.c >= c.o, chg = c.o ? (c.c - c.o) / c.o * 100 : 0;
    function v(x){ return fmt.format(x); }
    var h = '<span class="sym">XAUUSD · ' + TFEN[S.tf] + '</span> <span class="' + (up ? 'gb' : 'gs') + '">O ' + v(c.o) + ' H ' + v(c.h) + ' L ' + v(c.l) + ' C ' + v(c.c) + ' (' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%)</span>';
    if (isCur) {
      var sg = null; S.signals.forEach(function(s){ if (s.tf === S.tf && s.b === c.b) sg = s; });
      h += ' <span class="tm">' + timeLabel(c.t, S.tf < 60 ? 15 : S.tf) + '</span>';
      if (sg) h += '<br><b class="' + (sg.side === 'buy' ? 'gb' : 'gs') + '">' + sg.side.toUpperCase() + '</b> entry ' + v(sg.entry) + ' · tp ' + v(sg.tp) + ' · sl ' + v(sg.sl) + ' · score ' + sg.score + ' · ' + sg.why.join('+');
    }
    $('legend').innerHTML = h;
  }
  function renderStats(){
    var w = 0, l = 0, o = 0;
    S.signals.forEach(function(s){ if (s.tf !== S.tf) return; if (s.st === 'tp') w++; else if (s.st === 'sl') l++; else if (s.st === 'o') o++; });
    var t = 'إشارات ' + TFLBL[S.tf] + ': ✓ ' + w + ' · ✗ ' + l + ' · مفتوحة ' + o;
    if (w + l >= 5) t += ' · نجاح ' + Math.round(w / (w + l) * 100) + '%';
    $('stats').textContent = t + ' · آلية وليست نصيحة استثمارية';
  }

  /* ---------- gestures: drag = pan, pinch / wheel / buttons = zoom ---------- */
  var ptrs = {}, gest = { moved:0, t0:0, d0:0, bars0:0, lastX:0 };
  function np(){ return Object.keys(ptrs).length; }
  function bucketAt(x){ return view.firstB + Math.floor(x / view.slot); }
  function setCursor(x){
    if (x < 0 || x > view.cw) return;
    var b = bucketAt(x);
    cur = b; schedDraw();
  }
  plot.addEventListener('pointerdown', function(e){
    try { plot.setPointerCapture(e.pointerId); } catch(_) {}
    var r = plot.getBoundingClientRect();
    ptrs[e.pointerId] = { x:e.clientX - r.left, y:e.clientY - r.top };
    if (np() === 1) { gest.moved = 0; gest.t0 = Date.now(); gest.lastX = ptrs[e.pointerId].x; }
    if (np() === 2) { var k = Object.keys(ptrs), A = ptrs[k[0]], B = ptrs[k[1]]; gest.d0 = Math.hypot(A.x - B.x, A.y - B.y) || 1; gest.bars0 = V.bars; gest.moved = 99; }
  });
  plot.addEventListener('pointermove', function(e){
    var r = plot.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (!ptrs[e.pointerId]) { if (e.pointerType === 'mouse' && !pinned) setCursor(x); return; }
    ptrs[e.pointerId] = { x:x, y:y };
    if (np() === 2) {
      var k = Object.keys(ptrs), A = ptrs[k[0]], B = ptrs[k[1]], d = Math.hypot(A.x - B.x, A.y - B.y) || 1;
      V.bars = gest.bars0 * gest.d0 / d; schedDraw(); return;
    }
    var dx = x - gest.lastX; gest.lastX = x; gest.moved += Math.abs(dx);
    if (gest.moved > 6) { V.off += dx / view.slot; cur = null; pinned = false; schedDraw(); }
  });
  function up(e){
    var had = !!ptrs[e.pointerId], x = had ? ptrs[e.pointerId].x : 0, wasOne = np() === 1;
    delete ptrs[e.pointerId];
    if (had && wasOne && gest.moved <= 6 && Date.now() - gest.t0 < 500 && e.type === 'pointerup') {
      if (pinned && cur === bucketAt(x)) { pinned = false; cur = null; schedDraw(); }
      else { pinned = true; setCursor(x); }
    }
  }
  plot.addEventListener('pointerup', up);
  plot.addEventListener('pointercancel', up);
  plot.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse' && !pinned && !np()) { cur = null; schedDraw(); } });
  plot.addEventListener('wheel', function(e){ e.preventDefault(); V.bars *= Math.exp(e.deltaY * 0.0015); schedDraw(); }, { passive:false });
  $('zin').addEventListener('click', function(){ V.bars /= 1.3; draw(); });
  $('zout').addEventListener('click', function(){ V.bars *= 1.3; draw(); });
  $('zlive').addEventListener('click', function(){ V.off = 0; cur = null; pinned = false; draw(); });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function(){ schedDraw(); }).observe(plot);
  window.addEventListener('resize', schedDraw);

  var tfBtns = document.querySelectorAll('.tfs button');
  tfBtns.forEach(function(b){
    b.addEventListener('click', function(){
      S.tf = parseInt(b.getAttribute('data-tf'), 10); V.off = 0; cur = null; pinned = false; save(); syncTf(); draw();
    });
  });
  function syncTf(){ tfBtns.forEach(function(b){ b.setAttribute('aria-pressed', parseInt(b.getAttribute('data-tf'), 10) === S.tf); }); }

  /* ---------- live price ---------- */
  function applyLive(p, mts){
    var now = Date.now(); oz = p; marketTs = mts || marketTs;
    liveUpdate(p, now); trackSignals(p, now); evaluateAll(p);
    if (now - lastSaveAt > 20000) save();
    draw();
  }
  function fetchPrice(){
    if (inFlight) return Promise.resolve();
    inFlight = true;
    var ctl = new AbortController(), to = setTimeout(function(){ ctl.abort(); }, 8000);
    return fetch(PRICE_URL, { cache:'no-store', signal:ctl.signal })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(d){
        var p = Number(d && (d.price != null ? d.price : (d.priceUsd != null ? d.priceUsd : d.ask)));
        if (!isFinite(p) || p <= 0) throw new Error('bad payload');
        var mts = d && d.updatedAt ? Date.parse(d.updatedAt) : 0, first = !lastOkAt;
        failures = 0; lastOkAt = Date.now();
        applyLive(p, isFinite(mts) ? mts : 0);
        if (first) loadHistory();
      })
      .catch(function(){ failures++; })
      .then(function(){ clearTimeout(to); inFlight = false; renderStatus(); });
  }
  function schedule(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      if (document.hidden && !S.notify) { schedule(); return; }
      fetchPrice().then(schedule);
    }, failures ? Math.min(30000, 3000 * failures) : POLL_MS);
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) { hiddenAt = Date.now(); return; }
    lockScreen();
    fetchPrice().then(schedule);
    if (hiddenAt && Date.now() - hiddenAt > 120000 && Date.now() - histAt > 120000) loadHistory();
  });
  window.addEventListener('online', function(){ fetchPrice().then(schedule); });

  function renderStatus(){
    var dot = $('dot'), banner = $('banner');
    banner.hidden = true;
    if (!lastOkAt) dot.className = failures ? 'dot off' : 'dot';
    else dot.className = (Date.now() - lastOkAt <= 10000) ? 'dot live' : 'dot off';
    if (failures >= 2) {
      banner.hidden = false;
      banner.textContent = oz ? 'تعذر جلب السعر. تُعرض آخر بيانات محفوظة ولا تصدر إشارات جديدة.' : 'تعذر جلب السعر. تأكد من الاتصال بالإنترنت.';
    } else if (lastOkAt && marketTs && (Date.now() - marketTs) > 900000) {
      banner.hidden = false;
      banner.textContent = 'السعر لم يتغير منذ فترة. غالبًا السوق مقفل (عطلة نهاية الأسبوع).';
    }
  }

  /* ---------- buyers / sellers ---------- */
  function pressure(){
    var a = S.candles[60];
    if (a.length < 5) return null;
    var sb = 0, tot = 0;
    for (var i = Math.max(0, a.length - 20); i < a.length; i++) {
      var c = a[i], r = c.h - c.l;
      if (r <= 0) continue;
      sb += r * (1 + ((c.c - c.l) - (c.h - c.c)) / r) / 2; tot += r;
    }
    return tot > 0 ? sb / tot * 100 : null;
  }
  function renderSent(){
    var ext = S.sentExt !== null && Date.now() - S.sentTs < 7200000;
    var v = ext ? S.sentExt : pressure();
    if (v === null) { $('sentBv').textContent = '—'; $('sentSv').textContent = '—'; $('sentB').style.width = '50%'; $('sentS').style.width = '50%'; $('sentNote').textContent = 'جارٍ جمع البيانات…'; return; }
    var b = Math.min(100, Math.max(0, Math.round(v))), s = 100 - b;
    $('sentB').style.width = b + '%'; $('sentS').style.width = s + '%';
    $('sentBv').textContent = b + '%'; $('sentSv').textContent = s + '%';
    $('sentNote').textContent = ext ? 'من المصدر الخارجي · ' + ageText(Math.round((Date.now() - S.sentTs) / 1000))
      : 'ضغط شراء/بيع محسوب لحظيًا من حركة آخر 20 دقيقة (ليس مراكز المتداولين الفعلية)';
  }
  function pickSent(d){
    if (!d || typeof d !== 'object') return null;
    var pairs = [['long','short'],['buyers','sellers'],['buy','sell'],['longPercentage','shortPercentage'],['longPct','shortPct']];
    for (var i = 0; i < pairs.length; i++) {
      var a = Number(d[pairs[i][0]]), b = Number(d[pairs[i][1]]);
      if (isFinite(a) && isFinite(b) && a + b > 0) return (a / (a + b)) * 100;
    }
    for (var key in d) { if (d[key] && typeof d[key] === 'object') { var r = pickSent(d[key]); if (r !== null) return r; } }
    return null;
  }
  function fetchSent(){
    getJSON(S.sentUrl || 'sentiment.json').then(function(d){
      var v = pickSent(d);
      if (v !== null) { S.sentExt = v; S.sentTs = (d && d.updated && isFinite(Date.parse(d.updated))) ? Date.parse(d.updated) : Date.now(); save(); renderSent(); }
    }).catch(function(){});
  }
  $('ntfyApply').addEventListener('click', function(){
    S.ntfy = $('ntfyTopic').value.trim().replace(/[^A-Za-z0-9_-]/g, ''); $('tpPips').value = S.tpPips; $('slPips').value = S.slPips; $('pipUsd').value = S.pipUsd; $('ntfyTopic').value = S.ntfy; save();
    showToast(S.ntfy ? 'تم حفظ قناة الإشعارات: ' + S.ntfy : 'تم إيقاف إشعارات ntfy', '');
  });
  $('sentUrlApply').addEventListener('click', function(){
    var u = $('sentUrl').value.trim();
    if (u && !/^https:\/\//i.test(u) && u.indexOf('://') >= 0) return;
    S.sentUrl = u; S.sentExt = null; save(); renderSent(); fetchSent();
  });

  function syncSens(){
    $('sensNormal').setAttribute('aria-pressed', S.sens !== 'high' && S.sens !== 'max');
    $('sensHigh').setAttribute('aria-pressed', S.sens === 'high');
    $('sensMax').setAttribute('aria-pressed', S.sens === 'max');
    $('modePips').setAttribute('aria-pressed', S.mode === 'pips');
    $('modeAtr').setAttribute('aria-pressed', S.mode !== 'pips');
  }
  ['Normal:normal', 'High:high', 'Max:max'].forEach(function(x){
    var kv = x.split(':'); $('sens' + kv[0]).addEventListener('click', function(){ S.sens = kv[1]; setSens(); syncSens(); save(); });
  });
  $('modePips').addEventListener('click', function(){ S.mode = 'pips'; syncSens(); save(); });
  $('modeAtr').addEventListener('click', function(){ S.mode = 'atr'; syncSens(); save(); });
  $('pipApply').addEventListener('click', function(){
    var tp = parseFloat($('tpPips').value), sl = parseFloat($('slPips').value), pu = parseFloat($('pipUsd').value);
    if (!(tp >= 5 && tp <= 300 && sl >= 5 && sl <= 300 && pu >= 0.01 && pu <= 1)) { showToast('قيم غير صالحة: الهدف والوقف من 5 إلى 300 بيب، وقيمة البيب من 0.01 إلى 1 دولار', ''); return; }
    S.tpPips = tp; S.slPips = sl; S.pipUsd = pu; S.mode = 'pips'; syncSens(); save();
    showToast('تم الحفظ: هدف ' + tp + ' بيب (' + fmt.format(tp * pu) + '$) ووقف ' + sl + ' بيب (' + fmt.format(sl * pu) + '$). تسري على الإشارات الجديدة فقط.', '');
  });

  /* ---------- init ---------- */
  $('ntfyTopic').value = S.ntfy; $('sentUrl').value = S.sentUrl;
  if (S.candles[60].length) oz = S.candles[60][S.candles[60].length-1].c;
  setSens(); syncSens(); replayOpen(); syncTf(); syncBell(); draw(); renderSent(); renderStatus(); lockScreen();
  setInterval(function(){ renderStatus(); renderSent(); renderDiag(); }, 1000);
  fetchPrice().then(schedule);
  fetchSent(); setInterval(fetchSent, SENT_MS);
})();
</script>
</body>
</html>
