<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الذهب">
<title>شموع الذهب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEA; --surface:#F8F9F6; --ink:#0F2A26; --muted:#5B6F6A; --line:#CBD3CD;
  --gold:#8A6210; --up:#1B7A4B; --down:#B23A2E; --warn:#A8700A; --chip:#D7A63A; --on-chip:#2A1D02;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1816; --surface:#12241F; --ink:#E6EFEA; --muted:#8FA59E; --line:#26403A;
    --gold:#E2B64E; --up:#4FC38A; --down:#F0806F; --warn:#E6B04A; --chip:#E2B64E; --on-chip:#1E1500;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 32px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:1.1rem;font-weight:600;margin:0}
.status{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--up);animation:pulse 1.8s ease-in-out infinite}
.dot.off{background:var(--down)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.lbl{font-size:.82rem;color:var(--muted)}
.price{font-size:2.4rem;font-weight:600;line-height:1.15;transition:color .6s}
.price.up{color:var(--up);transition:none} .price.down{color:var(--down);transition:none}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);margin-top:2px;min-height:1.4em}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}

.chips{display:flex;gap:6px;margin:12px 0 10px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.85rem;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--chip);color:var(--on-chip);border-color:var(--chip);font-weight:600}

.plot{position:relative;direction:ltr;height:200px;touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none}
.plot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.yl{position:absolute;left:0;font-size:.72rem;color:var(--muted);background:var(--surface);padding:0 4px;border-radius:4px;pointer-events:none}
#yMax{top:0} #yMin{bottom:0}
.cross{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);opacity:.6;display:none;pointer-events:none}
.pdot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);pointer-events:none}
.ohlc{font-size:.78rem;color:var(--muted);min-height:1.4em;margin-top:6px}
.chips{align-items:center}
.chips .lbl{margin-inline-end:4px}
.xl{display:flex;justify-content:space-between;direction:ltr;font-size:.72rem;color:var(--muted);margin-top:6px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted);text-align:center;padding:0 20px}
.banner{margin:10px 0 0;font-size:.8rem;color:var(--warn)}

h2{font-size:1rem;font-weight:600;margin:0 0 10px}
.sent{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--line)}
.sent-b{background:var(--up);height:100%;transition:width .5s}
.sent-s{background:var(--down);height:100%;transition:width .5s}
.sent-lbl{display:flex;justify-content:space-between;margin-top:10px;font-size:1.5rem;font-weight:600}
.sent-lbl small{font-size:.85rem;font-weight:500;margin-inline-end:6px}
.sent-lbl .b{color:var(--up)} .sent-lbl .s{color:var(--down)}
.note{font-size:.76rem;color:var(--muted);margin:10px 0 0}
details{margin-top:10px}
summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
.field{margin-top:10px}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=number],input[type=url]{flex:1;min-width:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem;direction:ltr;text-align:left}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.82rem}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>الذهب XAU/USD</h1>
    <div class="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusTxt">جارٍ الاتصال…</span></div>
  </div>

  <section class="panel" aria-label="شارت سعر الذهب">
    <div class="lbl">سعر الأونصة بالدولار</div>
    <div class="price num" id="price">—</div>
    <div class="meta"><span class="chg" id="chg"></span></div>

    <div class="chips" role="group" aria-label="حجم الشمعة">
      <span class="lbl">حجم الشمعة</span>
      <button data-tf="15" aria-pressed="false">15 ثانية</button>
      <button data-tf="60" aria-pressed="true">دقيقة</button>
      <button data-tf="300" aria-pressed="false">5 دقائق</button>
    </div>

    <div class="plot" id="plot">
      <svg id="svg" viewBox="0 0 320 160" preserveAspectRatio="none" aria-hidden="true"></svg>
      <span class="yl num" id="yMax"></span>
      <span class="yl num" id="yMin"></span>
      <div class="cross" id="cross"></div>
      <div class="pdot" id="pdot" hidden></div>
      <div class="empty" id="empty">الشموع تبدأ بالظهور بعد أول تحديثين للسعر، وتتراكم مع الوقت.</div>
    </div>
    <div class="xl"><span class="num" id="xStart"></span><span class="num" id="xEnd"></span></div>
    <div class="ohlc" id="readout" aria-live="off"></div>
    <p class="banner" id="banner" hidden></p>
  </section>

  <section class="panel" aria-labelledby="sentH">
    <h2 id="sentH">نسبة المشترين والبائعين</h2>
    <div class="sent" id="sentBar" role="img"><div class="sent-b" id="sentB"></div><div class="sent-s" id="sentS"></div></div>
    <div class="sent-lbl">
      <span class="b"><small>مشترون</small><span class="num" id="sentBv">—</span></span>
      <span class="s"><small>بائعون</small><span class="num" id="sentSv">—</span></span>
    </div>
    <p class="note" id="sentNote"></p>
    <details>
      <summary>تعديل النسبة</summary>
      <div class="field">
        <label class="f" for="sentManual">نسبة المشترين % (البائعون = الباقي)</label>
        <div class="row"><input type="number" id="sentManual" inputmode="decimal" step="1" min="0" max="100"><button class="ghost" id="sentApply">حفظ</button></div>
      </div>
      <div class="field">
        <label class="f" for="sentUrl">أو رابط JSON يتحدث كل 5 دقائق (long/short أو buyers/sellers)</label>
        <div class="row"><input type="url" id="sentUrl" placeholder="https://…"><button class="ghost" id="sentUrlApply">حفظ</button></div>
      </div>
    </details>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var PRICE_URL = 'https://api.gold-api.com/price/XAU';
  var POLL_MS = 1000, SENT_MS = 300000, KEEP_MS = 6*3600*1000, KEY = 'gold-chart-v1', lastSaveAt = 0;
  var fmt = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

  var S = { range:60, tf:60, ticks:[], sentBuy:64, sentTs:0, sentUrl:'' };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); for (var k in p) { if (k in S) S[k] = p[k]; } } } catch(e) {}
  if (!Array.isArray(S.ticks)) S.ticks = [];
  var cutoff = Date.now() - KEEP_MS;
  S.ticks = S.ticks.filter(function(t){ return Array.isArray(t) && t[0] >= cutoff && isFinite(t[1]); });
  function save(){
    try {
      var c15 = Date.now() - 900000, i = 0, o = {};
      for (var key in S) o[key] = S[key];
      o.ticks = S.ticks.filter(function(t){ return t[0] >= c15 || (i++ % 10 === 0); });
      localStorage.setItem(KEY, JSON.stringify(o));
      lastSaveAt = Date.now();
    } catch(e) {}
  }

  var oz = S.ticks.length ? S.ticks[S.ticks.length-1][1] : 0;
  var lastOkAt = 0, failures = 0, marketTs = 0, timer = null, inFlight = false;
  var view = { cs:[], map:{}, firstB:0, slot:1 };

  function money(v){ return '$' + fmt.format(v); }
  function pad(x){ return (x<10?'0':'') + x; }
  function hm(ts){ var d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function hms(ts){ var d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
  function ageText(sec){
    if (sec < 5) return 'الآن';
    if (sec < 60) return 'قبل ' + sec + ' ثانية';
    if (sec < 3600) return 'قبل ' + Math.floor(sec/60) + ' دقيقة';
    if (sec < 86400) return 'قبل ' + Math.floor(sec/3600) + ' ساعة';
    return 'قبل ' + Math.floor(sec/86400) + ' يوم';
  }

  /* ---------- chart (candlesticks) ---------- */
  var MAXC = 60, VBW = 320, VBH = 160;
  function buildCandles(){
    var ticks = S.ticks, ms = S.tf * 1000;
    if (!ticks.length) return { cs:[], map:{}, firstB:0 };
    var lastB = Math.floor(ticks[ticks.length-1][0] / ms), firstB = lastB - MAXC + 1, map = {}, cs = [];
    for (var i = ticks.length - 1; i >= 0; i--) {
      var b = Math.floor(ticks[i][0] / ms);
      if (b < firstB) break;
      var p = ticks[i][1], c = map[b];
      if (!c) { c = map[b] = { b:b, t:b*ms, o:p, h:p, l:p, c:p }; cs.push(c); }
      else { c.o = p; if (p > c.h) c.h = p; if (p < c.l) c.l = p; }
    }
    cs.reverse();
    return { cs:cs, map:map, firstB:firstB };
  }
  function draw(){
    var svg = $('svg'), empty = $('empty');
    var bc = buildCandles(), cs = bc.cs;
    view.cs = cs; view.map = bc.map; view.firstB = bc.firstB; view.slot = VBW / MAXC;
    $('yMax').textContent = ''; $('yMin').textContent = ''; $('xStart').textContent = ''; $('xEnd').textContent = '';
    $('pdot').hidden = true;
    if (S.ticks.length < 2 || !cs.length) { empty.style.display = 'flex'; svg.innerHTML = ''; renderChange(null); return; }
    empty.style.display = 'none';

    var min = Infinity, max = -Infinity;
    cs.forEach(function(c){ if (c.l < min) min = c.l; if (c.h > max) max = c.h; });
    var padv = (max - min) * 0.12 || 0.5, lo = min - padv, hi = max + padv;
    function Y(v){ return (VBH - (v - lo) / (hi - lo) * VBH).toFixed(2); }
    var slot = view.slot, bw = slot * 0.7, out = '';
    [0.25,0.5,0.75].forEach(function(f){
      out += '<line x1="0" x2="'+VBW+'" y1="'+(VBH*f)+'" y2="'+(VBH*f)+'" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 4"/>';
    });
    cs.forEach(function(c){
      var idx = c.b - bc.firstB, xc = (idx + 0.5) * slot, up = c.c >= c.o, col = up ? 'var(--up)' : 'var(--down)';
      var yTop = Y(Math.max(c.o, c.c)), yBot = Y(Math.min(c.o, c.c)), hgt = Math.max(0.8, yBot - yTop);
      out += '<line x1="'+xc.toFixed(2)+'" x2="'+xc.toFixed(2)+'" y1="'+Y(c.h)+'" y2="'+Y(c.l)+'" stroke="'+col+'" stroke-width="1.4" vector-effect="non-scaling-stroke"/>';
      out += '<rect x="'+(xc - bw/2).toFixed(2)+'" y="'+yTop+'" width="'+bw.toFixed(2)+'" height="'+hgt.toFixed(2)+'" fill="'+col+'"/>';
    });
    var lastC = cs[cs.length-1], lcol = lastC.c >= lastC.o ? 'var(--up)' : 'var(--down)';
    out += '<line x1="0" x2="'+VBW+'" y1="'+Y(lastC.c)+'" y2="'+Y(lastC.c)+'" stroke="'+lcol+'" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="2 3" opacity=".8"/>';
    svg.innerHTML = out;

    $('yMax').textContent = fmt.format(max);
    $('yMin').textContent = fmt.format(min);
    $('xStart').textContent = (S.tf < 60 ? hms(cs[0].t) : hm(cs[0].t));
    $('xEnd').textContent = (S.tf < 60 ? hms(lastC.t) : hm(lastC.t));
    renderChange(cs);
  }
  function renderChange(cs){
    var c = $('chg');
    if (!cs || !cs.length) { c.textContent = ''; c.className = 'chg'; return; }
    var a = cs[0].o, b = cs[cs.length-1].c, d = b - a, pct = a ? d/a*100 : 0;
    if (Math.abs(d) < 0.005) { c.className = 'chg'; c.textContent = 'ثابت في هذا المدى'; return; }
    var up = d > 0;
    c.className = 'chg ' + (up ? 'up' : 'down');
    c.innerHTML = (up ? '▲ ' : '▼ ') + '<span class="num">' + (up ? '+' : '-') + fmt.format(Math.abs(d)) + ' (' + Math.abs(pct).toFixed(2) + '%)</span>';
  }
  function renderPrice(dir){
    var el = $('price');
    el.textContent = oz ? money(oz) : '—';
    if (dir) {
      el.classList.remove('up','down'); void el.offsetWidth; el.classList.add(dir);
      setTimeout(function(){ el.classList.remove('up','down'); }, 700);
    }
  }

  /* touch / hover readout */
  var plot = $('plot');
  function pointer(e){
    if (!view.cs || !view.cs.length) return;
    var r = plot.getBoundingClientRect();
    var xs = (e.clientX - r.left) / r.width * VBW;
    var idx = Math.min(MAXC - 1, Math.max(0, Math.floor(xs / view.slot)));
    var c = view.map[view.firstB + idx];
    if (!c) { leave(); return; }
    var cr = $('cross'); cr.style.display = 'block'; cr.style.left = ((idx + 0.5) * view.slot / VBW * 100) + '%';
    function v(x){ return '<span class="num">' + fmt.format(x) + '</span>'; }
    $('readout').innerHTML = 'فتح ' + v(c.o) + ' · أعلى ' + v(c.h) + ' · أدنى ' + v(c.l) + ' · إغلاق ' + v(c.c) + ' · <span class="num">' + hms(c.t) + '</span>';
  }
  function leave(){ $('cross').style.display = 'none'; $('readout').textContent = ''; }
  plot.addEventListener('pointermove', pointer);
  plot.addEventListener('pointerdown', pointer);
  plot.addEventListener('pointerleave', leave);
  plot.addEventListener('pointercancel', leave);
  plot.addEventListener('pointerup', function(e){ if (e.pointerType !== 'mouse') leave(); });

  document.querySelectorAll('.chips button').forEach(function(b){
    b.addEventListener('click', function(){
      S.tf = parseInt(b.getAttribute('data-tf'), 10); save(); syncChips(); draw();
    });
  });
  function syncChips(){
    document.querySelectorAll('.chips button').forEach(function(b){
      b.setAttribute('aria-pressed', parseInt(b.getAttribute('data-tf'), 10) === S.tf);
    });
  }

  /* ---------- live price ---------- */
  function applyLive(p, mts){
    var dir = null;
    if (oz && p !== oz) dir = p > oz ? 'up' : 'down';
    oz = p; marketTs = mts || marketTs;
    S.ticks.push([Date.now(), p]);
    var cut = Date.now() - KEEP_MS;
    while (S.ticks.length && S.ticks[0][0] < cut) S.ticks.shift();
    if (Date.now() - lastSaveAt > 10000) save();
    renderPrice(dir); draw();
  }
  function fetchPrice(){
    if (inFlight) return Promise.resolve();
    inFlight = true;
    var ctl = new AbortController(), to = setTimeout(function(){ ctl.abort(); }, 8000);
    return fetch(PRICE_URL, { cache:'no-store', signal:ctl.signal })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(d){
        var p = Number(d && (d.price != null ? d.price : (d.priceUsd != null ? d.priceUsd : d.ask)));
        if (!isFinite(p) || p <= 0) throw new Error('bad payload');
        var mts = d && d.updatedAt ? Date.parse(d.updatedAt) : 0;
        failures = 0; lastOkAt = Date.now();
        applyLive(p, isFinite(mts) ? mts : 0);
      })
      .catch(function(){ failures++; })
      .then(function(){ clearTimeout(to); inFlight = false; renderStatus(); });
  }
  function schedule(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      if (document.hidden) { schedule(); return; }
      fetchPrice().then(schedule);
    }, failures ? Math.min(30000, 3000 * failures) : POLL_MS);
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { fetchPrice().then(schedule); } });
  window.addEventListener('online', function(){ fetchPrice().then(schedule); });

  function renderStatus(){
    var dot = $('dot'), txt = $('statusTxt'), banner = $('banner');
    banner.hidden = true;
    if (!lastOkAt) {
      if (failures) { dot.className = 'dot off'; txt.textContent = 'غير متصل'; }
      else { dot.className = 'dot'; txt.textContent = 'جارٍ الاتصال…'; }
    } else {
      var age = Math.round((Date.now() - lastOkAt)/1000);
      if (age <= 10) { dot.className = 'dot live'; txt.textContent = 'مباشر · تحديث كل ثانية'; }
      else { dot.className = 'dot off'; txt.textContent = 'انقطع الاتصال · ' + ageText(age); }
    }
    if (failures >= 2) {
      banner.hidden = false;
      banner.textContent = oz ? 'تعذر جلب السعر. الشموع تعرض آخر بيانات محفوظة.' : 'تعذر جلب السعر. تأكد من الاتصال بالإنترنت.';
    } else if (lastOkAt && marketTs && (Date.now() - marketTs) > 900000) {
      banner.hidden = false;
      banner.textContent = 'السعر لم يتغير منذ فترة. غالبًا السوق مقفل (عطلة نهاية الأسبوع).';
    }
  }

  /* ---------- sentiment ---------- */
  function renderSent(){
    var b = Math.min(100, Math.max(0, Math.round(S.sentBuy))), s = 100 - b;
    $('sentB').style.width = b + '%'; $('sentS').style.width = s + '%';
    $('sentBv').textContent = b + '%'; $('sentSv').textContent = s + '%';
    $('sentBar').setAttribute('aria-label', 'مشترون ' + b + '% وبائعون ' + s + '%');
    var src = S.sentUrl ? 'من الرابط الذي ضبطته' : (S.sentTs ? 'أدخلتها يدويًا' : 'قيمة ابتدائية تقريبية، عدّلها من الأسفل');
    $('sentNote').textContent = src + (S.sentTs ? ' — ' + ageText(Math.round((Date.now()-S.sentTs)/1000)) : '') +
      '. النسبة تخص المتداولين الأفراد في عقود الذهب.';
  }
  function pickSent(d){
    if (!d || typeof d !== 'object') return null;
    var pairs = [['long','short'],['buyers','sellers'],['buy','sell'],['longPercentage','shortPercentage'],['longPct','shortPct']];
    for (var i = 0; i < pairs.length; i++) {
      var a = Number(d[pairs[i][0]]), b = Number(d[pairs[i][1]]);
      if (isFinite(a) && isFinite(b) && a + b > 0) return (a / (a + b)) * 100;
    }
    for (var key in d) { if (d[key] && typeof d[key] === 'object') { var r = pickSent(d[key]); if (r !== null) return r; } }
    return null;
  }
  function fetchSent(){
    if (!S.sentUrl) return;
    fetch(S.sentUrl, { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(d){
      var v = pickSent(d);
      if (v !== null) { S.sentBuy = v; S.sentTs = Date.now(); save(); renderSent(); }
    }).catch(function(){});
  }
  $('sentApply').addEventListener('click', function(){
    var v = parseFloat($('sentManual').value);
    if (!isFinite(v) || v < 0 || v > 100) return;
    S.sentBuy = v; S.sentTs = Date.now(); S.sentUrl = ''; $('sentUrl').value = ''; save(); renderSent();
  });
  $('sentUrlApply').addEventListener('click', function(){
    var u = $('sentUrl').value.trim();
    if (u && !/^https:\/\//i.test(u)) return;
    S.sentUrl = u; save(); renderSent(); fetchSent();
  });

  /* ---------- init ---------- */
  $('sentManual').value = S.sentBuy; $('sentUrl').value = S.sentUrl;
  syncChips(); renderPrice(); draw(); renderSent(); renderStatus();
  setInterval(function(){ renderStatus(); renderSent(); }, 1000);
  fetchPrice().then(schedule);
  fetchSent(); if (S.sentUrl) setInterval(fetchSent, SENT_MS);
})();
</script>
</body>
</html>
