<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الذهب">
<title>شموع الذهب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEA; --surface:#F8F9F6; --ink:#0F2A26; --muted:#5B6F6A; --line:#CBD3CD;
  --gold:#8A6210; --up:#1B7A4B; --down:#B23A2E; --warn:#A8700A; --chip:#D7A63A; --on-chip:#2A1D02;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1816; --surface:#12241F; --ink:#E6EFEA; --muted:#8FA59E; --line:#26403A;
    --gold:#E2B64E; --up:#4FC38A; --down:#F0806F; --warn:#E6B04A; --chip:#E2B64E; --on-chip:#1E1500;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 32px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:1.1rem;font-weight:600;margin:0}
.status{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--up);animation:pulse 1.8s ease-in-out infinite}
.dot.off{background:var(--down)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.lbl{font-size:.82rem;color:var(--muted)}
.price{font-size:2.4rem;font-weight:600;line-height:1.15;transition:color .6s}
.price.up{color:var(--up);transition:none} .price.down{color:var(--down);transition:none}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);margin-top:2px;min-height:1.4em}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}

.chips{display:flex;gap:6px;margin:12px 0 10px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.85rem;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--chip);color:var(--on-chip);border-color:var(--chip);font-weight:600}

.plot{position:relative;direction:ltr;height:200px;touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none}
.plot svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.yl{position:absolute;left:0;font-size:.72rem;color:var(--muted);background:var(--surface);padding:0 4px;border-radius:4px;pointer-events:none}
#yMax{top:0} #yMin{bottom:0}
.cross{position:absolute;top:0;bottom:0;width:1px;background:var(--muted);opacity:.6;display:none;pointer-events:none}
.pdot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface);pointer-events:none}
.ohlc{font-size:.78rem;color:var(--muted);min-height:1.4em;margin-top:6px}
.chips{align-items:center}
.chips .lbl{margin-inline-end:4px}
.xl{display:flex;justify-content:space-between;direction:ltr;font-size:.72rem;color:var(--muted);margin-top:6px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted);text-align:center;padding:0 20px}
.banner{margin:10px 0 0;font-size:.8rem;color:var(--warn)}

h2{font-size:1rem;font-weight:600;margin:0 0 10px}
.sent{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--line)}
.sent-b{background:var(--up);height:100%;transition:width .5s}
.sent-s{background:var(--down);height:100%;transition:width .5s}
.sent-lbl{display:flex;justify-content:space-between;margin-top:10px;font-size:1.5rem;font-weight:600}
.sent-lbl small{font-size:.85rem;font-weight:500;margin-inline-end:6px}
.sent-lbl .b{color:var(--up)} .sent-lbl .s{color:var(--down)}
.note{font-size:.76rem;color:var(--muted);margin:10px 0 0}
details{margin-top:10px}
summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
.field{margin-top:10px}
label.f{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=number],input[type=url]{flex:1;min-width:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:1rem;direction:ltr;text-align:left}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.82rem}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bar .chips{margin:0}
.plot{height:min(60vh,440px);min-height:280px}
.ohlc{min-height:2.6em;line-height:1.7}
.ohlc .gb{color:var(--up)} .ohlc .gs{color:var(--down)}
.stats{font-size:.78rem;color:var(--muted);margin-top:4px}
.panel.chartp{padding:12px}
</style>
</head>
<body>
<div class="wrap">

  <section class="panel chartp" aria-label="شموع الذهب XAU/USD">
    <div class="bar">
      <div class="chips" role="group" aria-label="حجم الشمعة">
        <button data-tf="15" aria-pressed="false">15 ثانية</button>
        <button data-tf="60" aria-pressed="true">دقيقة</button>
        <button data-tf="300" aria-pressed="false">5 دقائق</button>
      </div>
      <div class="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusTxt">جارٍ الاتصال…</span></div>
    </div>
    <div class="plot" id="plot">
      <svg id="svg" aria-hidden="true"></svg>
      <div class="cross" id="cross"></div>
      <div class="empty" id="empty">الشموع تبدأ بالظهور بعد أول تحديثين للسعر، وتتراكم مع الوقت.</div>
    </div>
    <div class="xl"><span class="num" id="xStart"></span><span class="num" id="xEnd"></span></div>
    <div class="ohlc" id="readout" aria-live="off"></div>
    <div class="stats" id="stats"></div>
    <p class="banner" id="banner" hidden></p>
    <p class="note">الإشارات آلية من تقاطع عدة مدارس (كلاسيك، SMC، ICT، الوقت) وتصدر نادرًا عند إغلاق الشمعة فقط. لا يوجد تحليل مضمون، ونتائجها الفعلية تظهر أعلاه. ليست نصيحة استثمارية.</p>
  </section>

  <section class="panel" aria-labelledby="sentH">
    <h2 id="sentH">نسبة المشترين والبائعين</h2>
    <div class="sent" id="sentBar" role="img"><div class="sent-b" id="sentB"></div><div class="sent-s" id="sentS"></div></div>
    <div class="sent-lbl">
      <span class="b"><small>مشترون</small><span class="num" id="sentBv">—</span></span>
      <span class="s"><small>بائعون</small><span class="num" id="sentSv">—</span></span>
    </div>
    <p class="note" id="sentNote"></p>
    <details>
      <summary>تعديل النسبة</summary>
      <div class="field">
        <label class="f" for="sentManual">نسبة المشترين % (البائعون = الباقي)</label>
        <div class="row"><input type="number" id="sentManual" inputmode="decimal" step="1" min="0" max="100"><button class="ghost" id="sentApply">حفظ</button></div>
      </div>
      <div class="field">
        <label class="f" for="sentUrl">أو رابط JSON يتحدث كل 5 دقائق (long/short أو buyers/sellers)</label>
        <div class="row"><input type="url" id="sentUrl" placeholder="https://…"><button class="ghost" id="sentUrlApply">حفظ</button></div>
      </div>
    </details>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var PRICE_URL = 'https://api.gold-api.com/price/XAU';
  var POLL_MS = 1000, SENT_MS = 300000, KEEP_MS = 12*3600*1000, KEY = 'gold-chart-v1', lastSaveAt = 0;
  var TFS = [15, 60, 300];
  var fmt = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

  var S = { tf:60, ticks:[], signals:[], sentBuy:64, sentTs:0, sentUrl:'' };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); for (var k in p) { if (k in S) S[k] = p[k]; } } } catch(e) {}
  if (!Array.isArray(S.ticks)) S.ticks = [];
  if (!Array.isArray(S.signals)) S.signals = [];
  var cutoff = Date.now() - KEEP_MS;
  S.ticks = S.ticks.filter(function(t){ return Array.isArray(t) && t[0] >= cutoff && isFinite(t[1]); });
  S.signals = S.signals.filter(function(s){ return s && s.ts >= cutoff; }).slice(-100);
  function save(){
    try {
      var c15 = Date.now() - 900000, i = 0, o = {};
      for (var key in S) o[key] = S[key];
      o.ticks = S.ticks.filter(function(t){ return t[0] >= c15 || (i++ % 10 === 0); });
      localStorage.setItem(KEY, JSON.stringify(o));
      lastSaveAt = Date.now();
    } catch(e) {}
  }

  var oz = S.ticks.length ? S.ticks[S.ticks.length-1][1] : 0;
  var lastOkAt = 0, failures = 0, marketTs = 0, timer = null, inFlight = false;
  var view = { map:{}, firstB:0, slot:1, cw:1 };

  function pad(x){ return (x<10?'0':'') + x; }
  function hm(ts){ var d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function hms(ts){ var d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
  function ageText(sec){
    if (sec < 5) return 'الآن';
    if (sec < 60) return 'قبل ' + sec + ' ثانية';
    if (sec < 3600) return 'قبل ' + Math.floor(sec/60) + ' دقيقة';
    if (sec < 86400) return 'قبل ' + Math.floor(sec/3600) + ' ساعة';
    return 'قبل ' + Math.floor(sec/86400) + ' يوم';
  }

  /* ---------- analysis engine ---------- */
  /*ENGINE_START*/
function buildSeries(ticks, tf, o){
  o = o || {};
  var ms = tf * 1000, out = [], map = {}, maxN = o.maxN || 1e9;
  for (var i = ticks.length - 1; i >= 0; i--) {
    var b = Math.floor(ticks[i][0] / ms);
    if (o.beforeB != null && b >= o.beforeB) continue;
    if (o.minB != null && b < o.minB) break;
    var p = ticks[i][1], c = map[b];
    if (!c) {
      if (out.length >= maxN) break;
      c = map[b] = { b:b, t:b*ms, o:p, h:p, l:p, c:p }; out.push(c);
    } else { c.o = p; if (p > c.h) c.h = p; if (p < c.l) c.l = p; }
  }
  return out.reverse();
}
function emaArr(v, n){
  var k = 2 / (n + 1), o = [], e = 0;
  for (var i = 0; i < v.length; i++) { e = i ? v[i] * k + e * (1 - k) : v[0]; o.push(e); }
  return o;
}
function rsiArr(v, n){
  var o = [], ag = 0, al = 0;
  for (var i = 0; i < v.length; i++) {
    if (i === 0) { o.push(null); continue; }
    var d = v[i] - v[i-1], g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    if (i <= n) {
      ag += g; al += l;
      if (i === n) { ag /= n; al /= n; o.push(al === 0 ? 100 : 100 - 100 / (1 + ag / al)); } else o.push(null);
    } else {
      ag = (ag * (n - 1) + g) / n; al = (al * (n - 1) + l) / n;
      o.push(al === 0 ? 100 : 100 - 100 / (1 + ag / al));
    }
  }
  return o;
}
function atrAvg(cs, n){
  var s = 0, k = 0;
  for (var i = cs.length - n; i < cs.length; i++) {
    if (i < 1) continue;
    s += Math.max(cs[i].h - cs[i].l, Math.abs(cs[i].h - cs[i-1].c), Math.abs(cs[i].l - cs[i-1].c)); k++;
  }
  return k ? s / k : 0;
}
function swings(cs, k){
  var hi = [], lo = [], n = cs.length;
  for (var i = k; i < n - k; i++) {
    var isH = true, isL = true;
    for (var j = 1; j <= k; j++) {
      if (!(cs[i].h > cs[i-j].h && cs[i].h > cs[i+j].h)) isH = false;
      if (!(cs[i].l < cs[i-j].l && cs[i].l < cs[i+j].l)) isL = false;
    }
    if (isH) hi.push({ i:i, p:cs[i].h });
    if (isL) lo.push({ i:i, p:cs[i].l });
  }
  return { hi:hi, lo:lo };
}
function mk(){ return { s:0, why:[], smc:0, cls:0 }; }
function add(o, pts, tag, kind){ o.s += pts; o.why.push(tag); if (kind === 'smc') o.smc++; else if (kind === 'cls') o.cls++; }

var SIG_TH = 8;
/* cs: closed candles (ascending), htf: closed higher-timeframe candles, price: entry, utcMin: minutes since 00:00 UTC */
function analyze(cs, htf, price, utcMin){
  var n = cs.length;
  if (n < 45) return null;
  var L = cs[n-1], P = cs[n-2];
  var atr = atrAvg(cs, 14);
  if (!(atr > 0) || atr / L.c < 0.00003) return null;
  if (L.b - cs[n-20].b > 26) return null;
  var nf = 0, q;
  for (q = n - 14; q < n; q++) if (cs[q].h > cs[q].l) nf++;
  if (nf < 10) return null;
  var hr = Math.floor(utcMin / 60);
  if (hr >= 21 && hr < 23) return null;
  if (!htf || htf.length < 14) return null;
  var hc = htf.map(function(c){ return c.c; }), h5 = emaArr(hc, 5), h13 = emaArr(hc, 13), hn = hc.length - 1;
  var hBull = h5[hn] > h13[hn] && hc[hn] > h13[hn], hBear = h5[hn] < h13[hn] && hc[hn] < h13[hn];
  if (!hBull && !hBear) return null;

  var closes = cs.map(function(c){ return c.c; });
  var Lg = mk(), Sh = mk();

  /* classic: trend, momentum, volatility */
  var e9 = emaArr(closes, 9), e21 = emaArr(closes, 21), e50 = emaArr(closes, 50);
  if (e9[n-1] > e21[n-1] && e21[n-1] > e50[n-1] && L.c > e21[n-1]) add(Lg, 2, 'EMA');
  if (e9[n-1] < e21[n-1] && e21[n-1] < e50[n-1] && L.c < e21[n-1]) add(Sh, 2, 'EMA');
  var rs = rsiArr(closes, 14), r = rs[n-1], rp = rs[n-2];
  if (r != null && rp != null) {
    if ((r > rp && r > 35 && r < 68) || (rp < 30 && r > rp)) add(Lg, 1, 'RSI');
    if ((r < rp && r < 65 && r > 32) || (rp > 70 && r < rp)) add(Sh, 1, 'RSI');
  }
  var e12 = emaArr(closes, 12), e26 = emaArr(closes, 26);
  var ml = e12.map(function(v, i){ return v - e26[i]; }), sg = emaArr(ml, 9);
  var hist = ml[n-1] - sg[n-1], histP = ml[n-2] - sg[n-2];
  if (hist > 0 && hist > histP) add(Lg, 1, 'MACD');
  if (hist < 0 && hist < histP) add(Sh, 1, 'MACD');
  var m = 0, sd = 0, w = 20;
  for (q = n - w; q < n; q++) m += closes[q]; m /= w;
  for (q = n - w; q < n; q++) sd += (closes[q] - m) * (closes[q] - m);
  sd = Math.sqrt(sd / w);
  if (L.l <= m - 2 * sd && L.c > m - 2 * sd) add(Lg, 1, 'BB', 'cls');
  if (L.h >= m + 2 * sd && L.c < m + 2 * sd) add(Sh, 1, 'BB', 'cls');

  /* classic: candle patterns */
  var body = Math.abs(L.c - L.o), rng = L.h - L.l, upW = L.h - Math.max(L.o, L.c), loW = Math.min(L.o, L.c) - L.l, pb = Math.abs(P.c - P.o);
  if (rng >= 0.5 * atr) {
    if (P.c < P.o && L.c > L.o && L.c >= P.o && L.o <= P.c && body > pb) add(Lg, 1.5, 'engulf', 'cls');
    if (P.c > P.o && L.c < L.o && L.c <= P.o && L.o >= P.c && body > pb) add(Sh, 1.5, 'engulf', 'cls');
    var bb = Math.max(body, 0.05 * rng);
    if (loW >= 2 * bb && upW <= 0.3 * rng) add(Lg, 1.5, 'pin', 'cls');
    if (upW >= 2 * bb && loW <= 0.3 * rng) add(Sh, 1.5, 'pin', 'cls');
  }

  /* classic: support / resistance from swing pivots, SMC: sweep + structure */
  var sw = swings(cs, 2), z = 0.35 * atr, sweepLo = null, sweepHi = null, i;
  for (i = sw.lo.length - 1; i >= 0; i--) {
    var s = sw.lo[i];
    if (s.i < n - 40) break;
    if (s.i > n - 3) continue;
    if (L.l < s.p && L.c > s.p) { if (sweepLo === null) sweepLo = s.p; }
    else if (Math.abs(L.l - s.p) <= z && L.c > s.p && L.c > L.o) { if (Lg.why.indexOf('S/R') < 0) add(Lg, 1.5, 'S/R', 'cls'); }
  }
  for (i = sw.hi.length - 1; i >= 0; i--) {
    var t = sw.hi[i];
    if (t.i < n - 40) break;
    if (t.i > n - 3) continue;
    if (L.h > t.p && L.c < t.p) { if (sweepHi === null) sweepHi = t.p; }
    else if (Math.abs(L.h - t.p) <= z && L.c < t.p && L.c < L.o) { if (Sh.why.indexOf('S/R') < 0) add(Sh, 1.5, 'S/R', 'cls'); }
  }
  if (sweepLo !== null) add(Lg, 2, 'sweep', 'smc');
  if (sweepHi !== null) add(Sh, 2, 'sweep', 'smc');
  var lastHi = sw.hi.length ? sw.hi[sw.hi.length-1] : null, lastLo = sw.lo.length ? sw.lo[sw.lo.length-1] : null;
  if (lastHi && L.c > lastHi.p && P.c <= lastHi.p) {
    var bearBefore = sw.hi.length >= 2 && sw.hi[sw.hi.length-1].p < sw.hi[sw.hi.length-2].p;
    add(Lg, bearBefore ? 2 : 1.5, bearBefore ? 'CHoCH' : 'BOS', 'smc');
  }
  if (lastLo && L.c < lastLo.p && P.c >= lastLo.p) {
    var bullBefore = sw.lo.length >= 2 && sw.lo[sw.lo.length-1].p > sw.lo[sw.lo.length-2].p;
    add(Sh, bullBefore ? 2 : 1.5, bullBefore ? 'CHoCH' : 'BOS', 'smc');
  }

  /* SMC: fair value gap (first retest) */
  var k, j, a, c3, hit;
  for (k = n - 3; k >= Math.max(1, n - 13); k--) {
    a = cs[k-1]; c3 = cs[k+1];
    if (c3.l - a.h > 0.3 * atr) {
      hit = false;
      for (j = k + 2; j <= n - 2; j++) if (cs[j].l <= c3.l) { hit = true; break; }
      if (!hit && L.l <= c3.l && L.c > a.h && L.c > L.o) { add(Lg, 1.5, 'FVG', 'smc'); break; }
    }
  }
  for (k = n - 3; k >= Math.max(1, n - 13); k--) {
    a = cs[k-1]; c3 = cs[k+1];
    if (a.l - c3.h > 0.3 * atr) {
      hit = false;
      for (j = k + 2; j <= n - 2; j++) if (cs[j].h >= c3.h) { hit = true; break; }
      if (!hit && L.h >= c3.h && L.c < a.l && L.c < L.o) { add(Sh, 1.5, 'FVG', 'smc'); break; }
    }
  }

  /* SMC: order block (first retest of the last candle before displacement) */
  for (k = n - 4; k >= Math.max(0, n - 22); k--) {
    var d = cs[k+1], ob = cs[k];
    if (ob.c < ob.o && d.c - d.o >= 1.2 * atr && d.c > ob.h) {
      hit = false;
      for (j = k + 2; j <= n - 2; j++) if (cs[j].l <= ob.o) { hit = true; break; }
      if (!hit && L.l <= ob.o && L.c > ob.l && L.c > L.o) add(Lg, 1.5, 'OB', 'smc');
      break;
    }
  }
  for (k = n - 4; k >= Math.max(0, n - 22); k--) {
    var d2 = cs[k+1], ob2 = cs[k];
    if (ob2.c > ob2.o && d2.o - d2.c >= 1.2 * atr && d2.c < ob2.l) {
      hit = false;
      for (j = k + 2; j <= n - 2; j++) if (cs[j].h >= ob2.o) { hit = true; break; }
      if (!hit && L.h >= ob2.o && L.c < ob2.h && L.c < L.o) add(Sh, 1.5, 'OB', 'smc');
      break;
    }
  }

  /* SMC: premium / discount of the recent range */
  var hiR = -Infinity, loR = Infinity;
  for (q = n - 40; q < n; q++) { if (cs[q].h > hiR) hiR = cs[q].h; if (cs[q].l < loR) loR = cs[q].l; }
  if (hiR - loR >= 3 * atr) {
    var pos = (L.c - loR) / (hiR - loR);
    if (pos <= 0.4) add(Lg, 1, 'DISC');
    if (pos >= 0.6) add(Sh, 1, 'PREM');
  }

  /* ICT time: kill zones (UTC): London 07-10, New York 12-15 */
  var kz = (utcMin >= 420 && utcMin < 600) || (utcMin >= 720 && utcMin < 900);
  if (kz) { Lg.s += 1; Sh.s += 1; Lg.why.push('KZ'); Sh.why.push('KZ'); } else { Lg.s -= 1; Sh.s -= 1; }

  var side = null, M = null;
  if (hBull && Lg.s >= SIG_TH && Sh.s <= 2.5 && Lg.smc >= 1 && Lg.cls >= 1) { side = 'buy'; M = Lg; }
  else if (hBear && Sh.s >= SIG_TH && Lg.s <= 2.5 && Sh.smc >= 1 && Sh.cls >= 1) { side = 'sell'; M = Sh; }
  if (!side) return null;
  M.why.push('HTF');

  /* risk: stop beyond the signal candle, min 0.8 ATR, max 2.2 ATR; target 1.5R, must not run into the nearest swing */
  var sl, tp, risk;
  if (side === 'buy') {
    sl = L.l - 0.15 * atr; risk = price - sl;
    if (risk < 0.8 * atr) { risk = 0.8 * atr; sl = price - risk; }
    if (risk > 2.2 * atr) return null;
    tp = price + 1.5 * risk;
    for (i = 0; i < sw.hi.length; i++) if (sw.hi[i].i >= n - 60 && sw.hi[i].p > price && sw.hi[i].p < price + 1.2 * risk) return null;
  } else {
    sl = L.h + 0.15 * atr; risk = sl - price;
    if (risk < 0.8 * atr) { risk = 0.8 * atr; sl = price + risk; }
    if (risk > 2.2 * atr) return null;
    tp = price - 1.5 * risk;
    for (i = 0; i < sw.lo.length; i++) if (sw.lo[i].i >= n - 60 && sw.lo[i].p < price && sw.lo[i].p > price - 1.2 * risk) return null;
  }
  return { side:side, entry:+price.toFixed(2), sl:+sl.toFixed(2), tp:+tp.toFixed(2), score:+M.s.toFixed(1), why:M.why };
}
/*ENGINE_END*/


  /* ---------- signals: creation + tracking ---------- */
  var evalB = {};
  function checkSignal(s, price, ts){
    if (s.st !== 'o') return false;
    var done = null;
    if (s.side === 'buy') { if (price >= s.tp) done = 'tp'; else if (price <= s.sl) done = 'sl'; }
    else { if (price <= s.tp) done = 'tp'; else if (price >= s.sl) done = 'sl'; }
    if (!done && ts - s.ts > 40 * s.tf * 1000) done = 'x';
    if (done) { s.st = done; s.ct = ts; return true; }
    return false;
  }
  function trackSignals(price, ts){
    var ch = false;
    S.signals.forEach(function(s){ if (checkSignal(s, price, ts)) ch = true; });
    if (ch) save();
  }
  function replayOpen(){
    var ch = false;
    S.signals.forEach(function(s){
      if (s.st !== 'o') return;
      for (var i = 0; i < S.ticks.length; i++) {
        if (S.ticks[i][0] <= s.ts) continue;
        if (checkSignal(s, S.ticks[i][1], S.ticks[i][0])) { ch = true; break; }
      }
    });
    if (ch) save();
  }
  function evaluateAll(price){
    var now = Date.now();
    if (!lastOkAt || now - lastOkAt > 5000) return;
    TFS.forEach(function(tf){
      var ms = tf * 1000, curB = Math.floor(now / ms);
      if (evalB[tf] === undefined) { evalB[tf] = curB; return; }
      if (evalB[tf] === curB) return;
      evalB[tf] = curB;
      if (S.signals.some(function(s){ return s.tf === tf && s.st === 'o'; })) return;
      var cs = buildSeries(S.ticks, tf, { maxN:150, beforeB:curB });
      if (!cs.length || cs[cs.length-1].b !== curB - 1) return;
      var hms4 = tf * 4 * 1000;
      var htf = buildSeries(S.ticks, tf * 4, { maxN:40, beforeB:Math.floor(now / hms4) });
      var d = new Date(now), um = d.getUTCHours() * 60 + d.getUTCMinutes();
      var r = analyze(cs, htf, price, um);
      if (!r) return;
      var b = cs[cs.length-1].b;
      if (S.signals.some(function(s){ return s.tf === tf && s.b === b; })) return;
      S.signals.push({ tf:tf, b:b, ts:now, side:r.side, entry:r.entry, tp:r.tp, sl:r.sl, score:r.score, why:r.why, st:'o', ct:0 });
      if (S.signals.length > 100) S.signals.shift();
      save();
    });
  }

  /* ---------- chart (candlesticks + signals) ---------- */
  var GUT = 62, plot = $('plot');
  function draw(){
    var svg = $('svg'), empty = $('empty'), W = plot.clientWidth || 320, H = plot.clientHeight || 300;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var CW = W - GUT, MAXC = Math.max(30, Math.floor(CW / 7)), slot = CW / MAXC, ms = S.tf * 1000;
    $('xStart').textContent = ''; $('xEnd').textContent = '';
    if (S.ticks.length < 2) { empty.style.display = 'flex'; svg.innerHTML = ''; view.map = {}; renderStats(); return; }
    var lastB = Math.floor(S.ticks[S.ticks.length-1][0] / ms), firstB = lastB - MAXC + 1;
    var cs = buildSeries(S.ticks, S.tf, { minB:firstB });
    var map = {}; cs.forEach(function(c){ map[c.b] = c; });
    view.map = map; view.firstB = firstB; view.slot = slot; view.cw = CW;
    if (!cs.length) { empty.style.display = 'flex'; svg.innerHTML = ''; renderStats(); return; }
    empty.style.display = 'none';

    var vis = S.signals.filter(function(s){
      if (s.tf !== S.tf || s.b < firstB - MAXC) return false;
      return s.st === 'o' || Math.floor(s.ct / ms) >= firstB;
    });
    var min = Infinity, max = -Infinity;
    cs.forEach(function(c){ if (c.l < min) min = c.l; if (c.h > max) max = c.h; });
    vis.forEach(function(s){
      if (s.tp > max) max = s.tp; if (s.tp < min) min = s.tp;
      if (s.sl > max) max = s.sl; if (s.sl < min) min = s.sl;
    });
    var padv = (max - min) * 0.04 || 0.5; min -= padv; max += padv;
    var top = 30, bot = H - 30;
    function Y(v){ return +(top + (max - v) / (max - min) * (bot - top)).toFixed(1); }

    var out = '', f, i;
    for (i = 1; i <= 4; i++) {
      f = i / 5; var gy = top + (bot - top) * f, gv = max - (max - min) * f;
      out += '<line x1="0" x2="'+CW+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" style="stroke:var(--line)" stroke-dasharray="3 4"/>';
      out += '<text x="3" y="'+(gy-3).toFixed(1)+'" font-size="9" style="fill:var(--muted)">'+fmt.format(gv)+'</text>';
    }
    /* TP / SL levels (under the candles) */
    vis.forEach(function(s){
      var open = s.st === 'o', idx = s.b - firstB, x0 = Math.max(0, (idx + 0.5) * slot);
      var x1 = open ? CW : Math.min(CW, Math.floor(s.ct / ms) - firstB + 0.5 > 0 ? (Math.floor(s.ct / ms) - firstB + 0.5) * slot : 0);
      if (x1 <= x0) x1 = Math.min(CW, x0 + slot);
      var op = open ? 1 : 0.55, yT = Y(s.tp), yS = Y(s.sl), yE = Y(s.entry);
      out += '<g opacity="'+op+'">';
      out += '<line x1="'+x0.toFixed(1)+'" x2="'+x1.toFixed(1)+'" y1="'+yE+'" y2="'+yE+'" style="stroke:var(--muted)" stroke-dasharray="1 3"/>';
      out += '<line x1="'+x0.toFixed(1)+'" x2="'+x1.toFixed(1)+'" y1="'+yT+'" y2="'+yT+'" style="stroke:var(--up)" stroke-width="1.2" stroke-dasharray="5 3"/>';
      out += '<line x1="'+x0.toFixed(1)+'" x2="'+x1.toFixed(1)+'" y1="'+yS+'" y2="'+yS+'" style="stroke:var(--down)" stroke-width="1.2" stroke-dasharray="5 3"/>';
      if (open) {
        out += '<text x="'+(CW+4)+'" y="'+(yT+3)+'" font-size="9.5" style="fill:var(--up)">tp '+fmt.format(s.tp)+'</text>';
        out += '<text x="'+(CW+4)+'" y="'+(yS+3)+'" font-size="9.5" style="fill:var(--down)">sl '+fmt.format(s.sl)+'</text>';
      } else {
        var anc = x1 > 40 ? 'end' : 'start', tx = anc === 'end' ? x1 - 2 : x1 + 2;
        out += '<text x="'+tx.toFixed(1)+'" y="'+(yT-3)+'" text-anchor="'+anc+'" font-size="9.5" style="fill:var(--up)">tp'+(s.st==='tp'?' ✓':'')+'</text>';
        out += '<text x="'+tx.toFixed(1)+'" y="'+(yS+10)+'" text-anchor="'+anc+'" font-size="9.5" style="fill:var(--down)">sl'+(s.st==='sl'?' ✗':'')+'</text>';
      }
      out += '</g>';
    });
    /* candles */
    var bw = Math.max(2, slot * 0.68);
    cs.forEach(function(c){
      var xc = (c.b - firstB + 0.5) * slot, up = c.c >= c.o, col = up ? 'var(--up)' : 'var(--down)';
      var yTop = Y(Math.max(c.o, c.c)), yBot = Y(Math.min(c.o, c.c)), hgt = Math.max(1, yBot - yTop);
      out += '<line x1="'+xc.toFixed(1)+'" x2="'+xc.toFixed(1)+'" y1="'+Y(c.h)+'" y2="'+Y(c.l)+'" style="stroke:'+col+'" stroke-width="1.2"/>';
      out += '<rect x="'+(xc - bw/2).toFixed(1)+'" y="'+yTop+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" style="fill:'+col+'"/>';
    });
    /* arrows + labels */
    vis.forEach(function(s){
      var c = map[s.b]; if (!c) return;
      var xc = (s.b - firstB + 0.5) * slot;
      if (s.side === 'buy') {
        var y0 = Y(c.l) + 5;
        out += '<polygon points="'+xc.toFixed(1)+','+y0+' '+(xc-4.5).toFixed(1)+','+(y0+8)+' '+(xc+4.5).toFixed(1)+','+(y0+8)+'" style="fill:var(--up)"/>';
        out += '<text x="'+xc.toFixed(1)+'" y="'+(y0+18)+'" text-anchor="middle" font-size="9" font-weight="600" style="fill:var(--up)">buy</text>';
      } else {
        var y1 = Y(c.h) - 5;
        out += '<polygon points="'+xc.toFixed(1)+','+y1+' '+(xc-4.5).toFixed(1)+','+(y1-8)+' '+(xc+4.5).toFixed(1)+','+(y1-8)+'" style="fill:var(--down)"/>';
        out += '<text x="'+xc.toFixed(1)+'" y="'+(y1-11)+'" text-anchor="middle" font-size="9" font-weight="600" style="fill:var(--down)">sell</text>';
      }
    });
    /* last price line + tag */
    var lc = cs[cs.length-1], lcol = lc.c >= lc.o ? 'var(--up)' : 'var(--down)', ly = Y(lc.c);
    out += '<line x1="0" x2="'+CW+'" y1="'+ly+'" y2="'+ly+'" style="stroke:'+lcol+'" stroke-width="1" stroke-dasharray="2 3" opacity=".8"/>';
    out += '<rect x="'+(CW+2)+'" y="'+(ly-8)+'" width="'+(GUT-4)+'" height="16" rx="3" style="fill:'+lcol+'"/>';
    out += '<text x="'+(CW+2+(GUT-4)/2)+'" y="'+(ly+3.5)+'" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--bg)">'+fmt.format(lc.c)+'</text>';
    svg.innerHTML = out;

    $('xStart').textContent = S.tf < 60 ? hms(cs[0].t) : hm(cs[0].t);
    $('xEnd').textContent = S.tf < 60 ? hms(lc.t) : hm(lc.t);
    renderStats();
  }
  function renderStats(){
    var w = 0, l = 0, o = 0;
    S.signals.forEach(function(s){
      if (s.tf !== S.tf) return;
      if (s.st === 'tp') w++; else if (s.st === 'sl') l++; else if (s.st === 'o') o++;
    });
    var t = 'نتائج الإشارات في هذا الإطار: ✓ ' + w + ' · ✗ ' + l + ' · مفتوحة ' + o;
    if (w + l >= 5) t += ' · نسبة النجاح ' + Math.round(w / (w + l) * 100) + '%';
    $('stats').textContent = t;
  }

  /* touch / hover readout */
  function pointer(e){
    var r = plot.getBoundingClientRect(), x = e.clientX - r.left;
    if (x < 0 || x > view.cw) { leave(); return; }
    var idx = Math.floor(x / view.slot), c = view.map[view.firstB + idx];
    if (!c) { leave(); return; }
    var cr = $('cross'); cr.style.display = 'block'; cr.style.left = ((idx + 0.5) * view.slot) + 'px';
    function v(n){ return '<span class="num">' + fmt.format(n) + '</span>'; }
    var h = 'فتح ' + v(c.o) + ' · أعلى ' + v(c.h) + ' · أدنى ' + v(c.l) + ' · إغلاق ' + v(c.c) + ' · <span class="num">' + hms(c.t) + '</span>';
    var sg = null;
    S.signals.forEach(function(s){ if (s.tf === S.tf && s.b === c.b) sg = s; });
    if (sg) {
      h += '<br><b class="' + (sg.side === 'buy' ? 'gb' : 'gs') + '">' + sg.side.toUpperCase() + '</b> دخول ' + v(sg.entry) + ' · tp ' + v(sg.tp) + ' · sl ' + v(sg.sl) +
        ' · قوة <span class="num">' + sg.score + '</span> · <span class="num">' + sg.why.join(' + ') + '</span>';
    }
    $('readout').innerHTML = h;
  }
  function leave(){ $('cross').style.display = 'none'; $('readout').textContent = ''; }
  plot.addEventListener('pointermove', pointer);
  plot.addEventListener('pointerdown', pointer);
  plot.addEventListener('pointerleave', leave);
  plot.addEventListener('pointercancel', leave);
  plot.addEventListener('pointerup', function(e){ if (e.pointerType !== 'mouse') leave(); });
  window.addEventListener('resize', draw);

  document.querySelectorAll('.chips button').forEach(function(b){
    b.addEventListener('click', function(){
      S.tf = parseInt(b.getAttribute('data-tf'), 10); save(); syncChips(); leave(); draw();
    });
  });
  function syncChips(){
    document.querySelectorAll('.chips button').forEach(function(b){
      b.setAttribute('aria-pressed', parseInt(b.getAttribute('data-tf'), 10) === S.tf);
    });
  }

  /* ---------- live price ---------- */
  function applyLive(p, mts){
    var now = Date.now();
    oz = p; marketTs = mts || marketTs;
    S.ticks.push([now, p]);
    var cut = now - KEEP_MS;
    while (S.ticks.length && S.ticks[0][0] < cut) S.ticks.shift();
    trackSignals(p, now);
    evaluateAll(p);
    if (now - lastSaveAt > 10000) save();
    draw();
  }
  function fetchPrice(){
    if (inFlight) return Promise.resolve();
    inFlight = true;
    var ctl = new AbortController(), to = setTimeout(function(){ ctl.abort(); }, 8000);
    return fetch(PRICE_URL, { cache:'no-store', signal:ctl.signal })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(d){
        var p = Number(d && (d.price != null ? d.price : (d.priceUsd != null ? d.priceUsd : d.ask)));
        if (!isFinite(p) || p <= 0) throw new Error('bad payload');
        var mts = d && d.updatedAt ? Date.parse(d.updatedAt) : 0;
        failures = 0; lastOkAt = Date.now();
        applyLive(p, isFinite(mts) ? mts : 0);
      })
      .catch(function(){ failures++; })
      .then(function(){ clearTimeout(to); inFlight = false; renderStatus(); });
  }
  function schedule(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      if (document.hidden) { schedule(); return; }
      fetchPrice().then(schedule);
    }, failures ? Math.min(30000, 3000 * failures) : POLL_MS);
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { fetchPrice().then(schedule); } });
  window.addEventListener('online', function(){ fetchPrice().then(schedule); });

  function renderStatus(){
    var dot = $('dot'), txt = $('statusTxt'), banner = $('banner');
    banner.hidden = true;
    if (!lastOkAt) {
      if (failures) { dot.className = 'dot off'; txt.textContent = 'غير متصل'; }
      else { dot.className = 'dot'; txt.textContent = 'جارٍ الاتصال…'; }
    } else {
      var age = Math.round((Date.now() - lastOkAt)/1000);
      if (age <= 10) { dot.className = 'dot live'; txt.textContent = 'مباشر'; }
      else { dot.className = 'dot off'; txt.textContent = 'انقطع · ' + ageText(age); }
    }
    if (failures >= 2) {
      banner.hidden = false;
      banner.textContent = oz ? 'تعذر جلب السعر. الشموع تعرض آخر بيانات محفوظة ولا تصدر إشارات جديدة.' : 'تعذر جلب السعر. تأكد من الاتصال بالإنترنت.';
    } else if (lastOkAt && marketTs && (Date.now() - marketTs) > 900000) {
      banner.hidden = false;
      banner.textContent = 'السعر لم يتغير منذ فترة. غالبًا السوق مقفل (عطلة نهاية الأسبوع).';
    }
  }

  /* ---------- sentiment ---------- */
  function renderSent(){
    var b = Math.min(100, Math.max(0, Math.round(S.sentBuy))), s = 100 - b;
    $('sentB').style.width = b + '%'; $('sentS').style.width = s + '%';
    $('sentBv').textContent = b + '%'; $('sentSv').textContent = s + '%';
    $('sentBar').setAttribute('aria-label', 'مشترون ' + b + '% وبائعون ' + s + '%');
    var src = S.sentUrl ? 'من الرابط الذي ضبطته' : (S.sentTs ? 'أدخلتها يدويًا' : 'قيمة ابتدائية تقريبية، عدّلها من الأسفل');
    $('sentNote').textContent = src + (S.sentTs ? ' — ' + ageText(Math.round((Date.now()-S.sentTs)/1000)) : '') +
      '. النسبة تخص المتداولين الأفراد في عقود الذهب.';
  }
  function pickSent(d){
    if (!d || typeof d !== 'object') return null;
    var pairs = [['long','short'],['buyers','sellers'],['buy','sell'],['longPercentage','shortPercentage'],['longPct','shortPct']];
    for (var i = 0; i < pairs.length; i++) {
      var a = Number(d[pairs[i][0]]), b = Number(d[pairs[i][1]]);
      if (isFinite(a) && isFinite(b) && a + b > 0) return (a / (a + b)) * 100;
    }
    for (var key in d) { if (d[key] && typeof d[key] === 'object') { var r = pickSent(d[key]); if (r !== null) return r; } }
    return null;
  }
  function fetchSent(){
    if (!S.sentUrl) return;
    fetch(S.sentUrl, { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(d){
      var v = pickSent(d);
      if (v !== null) { S.sentBuy = v; S.sentTs = Date.now(); save(); renderSent(); }
    }).catch(function(){});
  }
  $('sentApply').addEventListener('click', function(){
    var v = parseFloat($('sentManual').value);
    if (!isFinite(v) || v < 0 || v > 100) return;
    S.sentBuy = v; S.sentTs = Date.now(); S.sentUrl = ''; $('sentUrl').value = ''; save(); renderSent();
  });
  $('sentUrlApply').addEventListener('click', function(){
    var u = $('sentUrl').value.trim();
    if (u && !/^https:\/\//i.test(u)) return;
    S.sentUrl = u; save(); renderSent(); fetchSent();
  });


  /* ---------- init ---------- */
  $('sentManual').value = S.sentBuy; $('sentUrl').value = S.sentUrl;
  replayOpen(); syncChips(); draw(); renderSent(); renderStatus();
  setInterval(function(){ renderStatus(); renderSent(); }, 1000);
  fetchPrice().then(schedule);
  fetchSent(); if (S.sentUrl) setInterval(fetchSent, SENT_MS);
})();
